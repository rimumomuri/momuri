name: Momuri
options:
  bundleIdPrefix: com.rymchoi
  developmentLanguage: ko
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Momuri:
    type: application
    platform: iOS
    sources: [Momuri, Shared]
    info:
      path: Momuri/Info.plist
      properties:
        CFBundleDisplayName: momuri
        # 설정 앱의 앱별 언어에 한국어·일본어를 보여 준다
        CFBundleLocalizations: [ko, ja]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [momuri]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        BGTaskSchedulerPermittedIdentifiers: [com.rymchoi.momuri.share-refresh]
        NSAlarmKitUsageDescription: 꼭 해야 하는 루틴을 무음 모드에서도 알람으로 알려요.
        # 로컬 서버: 같은 와이파이의 아이폰도 닿도록 Mac의 Bonjour 이름을 쓴다
        MomuriServerURL: http://rymui-macstudio.local:8787
        NSLocalNetworkUsageDescription: 같은 와이파이에 있는 Mac의 momuri 서버와 공유 루틴을 주고받아요.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: 러닝 기록을 루틴에 자동으로 채우기 위해 건강 앱의 운동 기록을 읽어요.
        NSHealthUpdateUsageDescription: 개발용 샘플 운동 기록을 건강 앱에 넣을 때만 사용해요.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Momuri/Momuri.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rymchoi.momuri]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rymchoi.momuri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MomuriWidget
      - target: MomuriMonitor
      - target: MomuriReport
  MomuriWidget:
    type: app-extension
    platform: iOS
    sources: [MomuriWidget, Shared]
    info:
      path: MomuriWidget/Info.plist
      properties:
        CFBundleDisplayName: momuri
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MomuriWidget/MomuriWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rymchoi.momuri]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rymchoi.momuri.widget
  MomuriMonitor:
    type: app-extension
    platform: iOS
    sources: [MomuriMonitor, Shared/ScreenTimeShared.swift, Shared/Localization.swift, Shared/Localizable.xcstrings]
    info:
      path: MomuriMonitor/Info.plist
      properties:
        CFBundleDisplayName: momuri monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitor
    entitlements:
      path: MomuriMonitor/MomuriMonitor.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rymchoi.momuri]
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rymchoi.momuri.monitor
  MomuriReport:
    type: extensionkit-extension
    platform: iOS
    sources: [MomuriReport, Shared/ScreenTimeShared.swift, Shared/Localization.swift, Shared/Localizable.xcstrings]
    info:
      path: MomuriReport/Info.plist
      properties:
        CFBundleDisplayName: momuri report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: MomuriReport/MomuriReport.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rymchoi.momuri]
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rymchoi.momuri.report
  MomuriTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MomuriTests]
    dependencies:
      - target: Momuri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rymchoi.momuri.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Momuri:
    build:
      targets:
        Momuri: all
    test:
      targets: [MomuriTests]
      # 테스트는 한국어 문장을 확인하므로 시뮬레이터 언어와 상관없이 한국어로 돌린다
      language: ko
      region: KR
